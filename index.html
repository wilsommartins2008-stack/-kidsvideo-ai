<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>KidsVideo AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5ff;color:#20243a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:680px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 8px 30px #00000012}
h1{font-size:30px;margin:0 0 6px}.sub{color:#666;margin:0 0 22px}
label{display:block;font-weight:700;margin:14px 0 7px}
textarea,select{width:100%;border:1px solid #ddd;border-radius:15px;padding:14px;font-size:16px;background:#fff}
textarea{min-height:130px;resize:vertical}
button{width:100%;border:0;border-radius:16px;padding:16px;margin-top:18px;background:#6c5ce7;color:#fff;font-size:17px;font-weight:800}
button:disabled{opacity:.6}
#status{margin-top:16px;padding:13px;border-radius:14px;background:#f0efff;display:none;white-space:pre-wrap}
video{width:100%;margin-top:16px;border-radius:18px;background:#111;display:none}
.note{font-size:13px;color:#777;margin-top:15px;line-height:1.45}
</style>
</head>
<body>
<main>
<div class="card">
<h1>🎬 KidsVideo AI</h1>
<p class="sub">Cria vídeos infantis com IA diretamente pelo celular.</p>

<label for="prompt">O que queres no vídeo?</label>
<textarea id="prompt" placeholder="Ex.: Crianças e animais fofos num parque colorido ensinando a contar de 1 a 20."></textarea>

<label for="style">Estilo</label>
<select id="style">
<option>3D infantil colorido e educativo</option>
<option>2D desenho infantil educativo</option>
<option>Anime infantil</option>
<option>Fantasia 3D</option>
</select>

<label for="ratio">Formato</label>
<select id="ratio">
<option value="1280:720">YouTube — 16:9</option>
<option value="720:1280">Celular — 9:16</option>
</select>

<button id="go">✨ Criar vídeo</button>
<div id="status"></div>
<video id="video" controls playsinline></video>
<p class="note">A chave da IA fica no servidor, nunca no celular. O vídeo é gerado pela API da Runway. A geração usa créditos da conta conectada.</p>
</div>
</main>
<script>
const go=document.getElementById('go'), status=document.getElementById('status'), video=document.getElementById('video');
function show(t){status.style.display='block';status.textContent=t}
go.onclick=async()=>{
 const prompt=document.getElementById('prompt').value.trim();
 const style=document.getElementById('style').value;
 const ratio=document.getElementById('ratio').value;
 if(!prompt){show('✏️ Escreve primeiro a ideia do vídeo.');return}
 go.disabled=true; video.style.display='none'; show('⏳ A enviar o pedido para a IA...');
 try{
   const r=await fetch('/api/generate-video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,style,ratio})});
   const data=await r.json(); if(!r.ok) throw new Error(data.error||'Erro ao criar o vídeo');
   show('🎬 Vídeo em criação...\\nNão feches esta página.');
   const timer=setInterval(async()=>{
     try{
       const q=await fetch('/api/video/'+data.id); const d=await q.json();
       if(d.status==='SUCCEEDED'){clearInterval(timer);video.src=d.url;video.style.display='block';show('✅ Vídeo pronto!');go.disabled=false}
       else if(d.status==='FAILED'){clearInterval(timer);show('❌ A geração falhou. Tenta outro prompt.');go.disabled=false}
     }catch(e){clearInterval(timer);show('❌ Não foi possível consultar o vídeo.');go.disabled=false}
   },4000);
 }catch(e){show('❌ '+e.message);go.disabled=false}
};
</script>
</body>
</html>
